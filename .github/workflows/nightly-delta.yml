name: Nightly D1 delta

# Diffs the latest Scryfall bulk against the previous snapshot and applies only
# the new/changed rows to the D1 database. Insert/update only — never deletes.
on:
  schedule:
    - cron: '0 0 * * *' # midnight UTC daily (GitHub may delay a few minutes under load)
  workflow_dispatch: {}  # allow manual runs from the Actions tab

# Avoid overlapping runs writing to D1 at the same time.
concurrency:
  group: nightly-delta
  cancel-in-progress: false

jobs:
  delta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Carry cards.json between nightly runs so we can diff against yesterday.
      # Rolling cache: each run saves under a new key, restore-keys picks the
      # latest prior snapshot. A miss trips the --max-changes guard in
      # sync-delta.js rather than silently rewriting the whole table.
      #
      # Restore and save are deliberately split (rather than the combined
      # actions/cache action): the snapshot must only move forward once the rows
      # are actually in D1. The combined action's post-step saves even when a
      # later step failed, which would advance the snapshot past changes that
      # never landed — they'd never be re-emitted, leaving D1 silently stale.
      - name: Restore previous snapshot
        uses: actions/cache/restore@v4
        with:
          path: |
            cards.json
            cards-meta.json
          key: scryfall-snapshot-${{ github.run_id }}
          restore-keys: |
            scryfall-snapshot-

      - run: npm ci

      - name: Compute delta
        run: npm run sync:delta

      - name: Apply delta to D1
        if: hashFiles('cards-delta.sql') != ''
        run: npx wrangler d1 execute magic-art-cards --file=cards-delta.sql --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: No changes
        if: hashFiles('cards-delta.sql') == ''
        run: echo "No new or changed cards tonight — nothing to apply."

      # Only reached when every step above succeeded, so the snapshot we save is
      # guaranteed to match what D1 now contains. On failure nothing is saved and
      # tomorrow's run re-diffs from the same point, retrying tonight's changes.
      - name: Save snapshot for tomorrow
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            cards.json
            cards-meta.json
          key: scryfall-snapshot-${{ github.run_id }}
